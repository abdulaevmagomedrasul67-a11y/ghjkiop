name: Build StudTool APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Если файла gradlew нет, генерируем его через системный gradle
      - name: Ensure gradlew exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew не найден, генерируем..."
            # Устанавливаем Gradle через официальный action, чтобы сгенерировать wrapper
            gradle wrapper --gradle-version 8.7
          else
            echo "gradlew найден"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudTool-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
