name: Build StudTool APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure gradlew exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew не найден, генерируем..."
            gradle wrapper --gradle-version 9.3.1
          else
            echo "gradlew найден"
            # Обновляем версию внутри wrapper, если он уже есть
            sed -i 's/gradle-.*-bin.zip/gradle-9.3.1-bin.zip/' gradle/wrapper/gradle-wrapper.properties || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudTool-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
